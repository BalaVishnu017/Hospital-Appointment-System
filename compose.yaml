services:
  hospital:
    image: saigayathria48/hospital-appointment-system:latest
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DB_PATH: /data/hospital.sqlite
    volumes:
      - hospital-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  hospital-data:
